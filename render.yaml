services:
  - type: web
    name: gem-guild-board-game
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: SCORES_FILE
        value: /var/data/scores.json
    disk:
      name: leaderboard-data
      mountPath: /var/data
      sizeGB: 1
